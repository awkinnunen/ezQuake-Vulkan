// nQuake keyboard preset. Original bindings and helper aliases: nQuake contributors.
// INPUT-004, 2026-09-15. Extraction/packaging: OpenAI Codex, at the user's request.
// Source: official nQuake non-gpl.zip; exact source hashes in provenance/keyboard-presets.json.
// Select with keyboard_preset nquake to release movement and detach the Quick crosshair hook.
// Explicitly replaces all bindings. Does not load autoexec, graphics, sensitivity or audio settings.
set timer 0
alias time_dec                "if $timer == 0 then set timer 59 else inc timer -1;echo ^t^i^m^e :$timer"
alias time_inc                "if $timer == 59 then set timer 0 else inc timer 1;echo ^t^i^m^e :$timer"
alias tp_custom_getpenttimer  "say_team $\$cl_fakename: pent delayed {$timer} secs"
alias tp_custom_getquadtimer  "say_team $\$cl_fakename: quad delayed {$timer} secs"
alias _teamsays_echo_3        "echo ^C tells your team you are ^c^o^m^i^n^g"
alias _teamsays_echo_4        "echo ^F reports your location as ^s^a^f^e"
alias _teamsays_echo_5        "echo ^G requests ^h^e^l^p from your team"
alias _teamsays_echo_6        "echo ^R reports location of an item you are ^p^o^i^n^t^i^n^g at, or shows you the player status"
alias _teamsays_echo_7        "echo ^T reports your location as ^l^o^s^t"
alias _teamsays_echo_8        "echo ^V requests that someone ^r^e^p^l^a^c^e^s you"
alias vol+				"inc volume +0.005;echo Volume:&c0f0 $volume&r"
alias vol-				"if $volume > 0.005 inc volume -0.005 else volume 0;echo Volume:&cf00 $volume&r"
alias demo_faster             "demo_setspeed 400;echo Demo: Fast forward (faster)"
alias demo_fastest            "demo_setspeed 800;echo Demo: Fast forward (fastest)"
alias demo_fastfwd            "demo_setspeed 200;echo Demo: Fast forward"
alias demo_normal             "demo_setspeed 100;echo Demo: Normal speed"
alias demo_paused             "demo_setspeed 0;echo Demo: Paused"
alias demo_slower             "demo_setspeed 30;echo Demo: Slow motion (slower)"
alias demo_slowest            "demo_setspeed 15;echo Demo: Slow motion (slowest)"
alias demo_slowmo             "demo_setspeed 60;echo Demo: Slow motion"

unbindall
bind  TAB           "+showteamscores"
bind  ENTER         "messagemode"
bind  ESCAPE        "togglemenu"
bind  SPACE         "+jump"
bind  +             ""
bind  ,             ""
bind  -             ""
bind  .             ""
bind  /             "tracklist"
bind  0             ""
bind  1             "tp_msgquaddead"
bind  2             "weapon 2 1"
bind  3             "weapon 3 2"
bind  4             "weapon 5 4"
bind  5             "tp_msgenemypwr"
bind  6             ""
bind  7             ""
bind  8             ""
bind  9             ""
bind  =             ""
bind  [             "if $volume > 0.005 inc volume -0.005 else volume 0;echo Volume:&cf00 $volume&r"
bind  \             ""
bind  ]             "inc volume +0.005;echo Volume:&c0f0 $volume&r"
bind  _             ""
bind  `             "toggleconsole"
bind  a             "+moveleft"
bind  b             ""
bind  c             "tp_msgcoming"
bind  d             "+moveright"
bind  e             "weapon 7"
bind  f             "tp_msgsafe"
bind  g             "tp_msghelp"
bind  h 			""
bind  i  			""
bind  j             ""
bind  k 			""
bind  l             ""
bind  m 			""
bind  n             ""
bind  o             ""
bind  p             ""
bind  q             "weapon 6"
bind  r             "tp_msgpoint; shownick"
bind  s             "+back"
bind  t             "tp_msglost"
bind  u             "messagemode"
bind  v             "tp_msgreplace"
bind  w             "+forward"
bind  x             ""
bind  y             "messagemode2"
bind  z             ""
bind  ~             "toggleconsole"
bind  BACKSPACE     ""
bind  PAUSE         "toggleproxymenu"
bind  UPARROW       ""
bind  DOWNARROW     ""
bind  LEFTARROW     ""
bind  RIGHTARROW    ""
bind  CAPSLOCK      ""
bind  ALT           ""
bind  LSHIFT        ""
bind  RSHIFT        "say :)"
bind  CTRL          "tp_msgtook"
bind  SHIFT         "tp_msgreport"
bind  F1            "tp_msggetquad"
bind  F2            "tp_msggetpent"
bind  F3            "tp_custom_getquadtimer"
bind  F4            "tp_custom_getpenttimer"
bind  F5            "toggleready"
bind  F6            "break"
bind  F7            "join"
bind  F8            "observe"
bind  F9            "menu_slist"
bind  F10           ""
bind  F11           ""
bind  F12           "screenshot"
bind  INS           ""
bind  DEL           ""
bind  PGDN          "break"
bind  PGUP          "ready"
bind  HOME          ""
bind  END           ""
bind  KP_STAR       "match_save"
bind  KP_HOME       "demo_slowest"
bind  KP_UPARROW    "demo_paused"
bind  KP_PGUP       "demo_fastest"
bind  KP_MINUS      "vol-"
bind  KP_LEFTARROW  "demo_slower"
bind  KP_5          "demo_normal"
bind  KP_RIGHTARROW "demo_faster"
bind  KP_PLUS       "vol+"
bind  KP_END        "demo_slowmo"
bind  KP_DOWNARROW  "demo_paused"
bind  KP_PGDN       "demo_fastfwd"
bind  KP_ENTER      "scores"
bind  MOUSE1        "+attack"
bind  MOUSE2        "weapon 8"
bind  MOUSE3        ""
bind MOUSE5         "weapon 3 2"
bind MOUSE4         "weapon 5 4"
bind MWHEELUP       "time_inc"
bind MWHEELDOWN     "time_dec"
echo nQuake keyboard loaded.
