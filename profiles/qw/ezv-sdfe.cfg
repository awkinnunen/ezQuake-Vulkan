// INPUT-003, 2026-09-15. User-selected layout, packaged by OpenAI Codex.
// Quick ESDF: E forward, D back, S left, F right. Graphics are unchanged.
// User legacy aliases; earlier snippet authors unknown.
unbind a
unbind b
unbind c
unbind d
unbind e
unbind f
unbind g
unbind h
unbind i
unbind j
unbind k
unbind l
unbind m
unbind n
unbind o
unbind p
unbind q
unbind r
unbind s
unbind t
unbind u
unbind v
unbind w
unbind x
unbind y
unbind z
unbind CAPSLOCK
allow_scripts 2

// Keep the old jump timing; restore keyboard look speed after each jump.
alias legacy_frj "impulse 7;rotate 180;+jump;+attack;wait;rotate 180;-attack;-jump"
alias legacy_sj "set legacy_pitchspeed $cl_pitchspeed;cl_pitchspeed 350;+forward;impulse 7;wait;wait;wait;wait;wait;wait;+jump;-forward;+lookdown;wait;wait;wait;-lookdown;-jump;legacy_frj;force_centerview;cl_pitchspeed $legacy_pitchspeed"
alias legacy_rj "set legacy_pitchspeed $cl_pitchspeed;cl_pitchspeed 9999;+lookdown;impulse 7;+jump;wait;wait;+attack;wait;-lookdown;-attack;force_centerview;-jump;cl_pitchspeed $legacy_pitchspeed"
set legacy_forwardheld 0
set legacy_backheld 0
alias legacy_jump_back "if $legacy_backheld == 0 then bind a legacy_sj else bind a legacy_rj"
alias legacy_jump_bind "if $legacy_forwardheld == 0 then legacy_jump_back else bind a legacy_rj"
alias +legacy_fw "+forward;set legacy_forwardheld 1;legacy_jump_bind"
alias -legacy_fw "-forward;set legacy_forwardheld 0;legacy_jump_bind"
alias +legacy_bw "+back;set legacy_backheld 1;legacy_jump_bind"
alias -legacy_bw "-back;set legacy_backheld 0;legacy_jump_bind"

// Old weapon preferences. Release normally keeps the selected weapon.
alias +legacy_rl "impulse 7 5 3 4 2 1;+attack"
alias -legacy_rl "legacy_release"
alias +legacy_gl "impulse 6 5 4 3 2 1;+attack"
alias -legacy_gl "legacy_release"
alias +legacy_shaft "set legacy_lgfiring 1;impulse 8 3 2 5 4 1;+attack;legacy_crosshair"
alias -legacy_shaft "set legacy_lgfiring 0;legacy_release;legacy_crosshair"
alias +legacy_sg "impulse 2;+attack"
alias -legacy_sg "legacy_release"
alias +legacy_sng "impulse 5 4 2;+attack"
alias -legacy_sng "legacy_release"
alias +legacy_ssg "impulse 3 2;+attack"
alias -legacy_ssg "legacy_release"
alias legacy_keep_weapon "-attack"
alias legacy_return_sg "impulse 2;-attack"
alias legacy_denial_off "alias legacy_release legacy_keep_weapon;bind KP_STAR legacy_denial_on;echo Legacy shotgun return: off"
alias legacy_denial_on "alias legacy_release legacy_return_sg;bind KP_STAR legacy_denial_off;echo Legacy shotgun return: on"
legacy_denial_off

// Original weapon-specific PNGs and their legacy sizing.
exec ezv-crosshairs.cfg
tp_triggers 1

bind e +legacy_fw
bind d +legacy_bw
bind s +moveleft
bind f +moveright
bind a legacy_sj
bind MOUSE1 +legacy_rl
bind MOUSE2 +legacy_shaft
bind MOUSE3 +legacy_gl
bind SPACE +jump
// nQuake communication keys shifted one column right around ESDF.
unbind w
unbind c
unbind r
bind g tp_msgsafe
bind h tp_msghelp
bind t "tp_msgpoint; shownick"
bind y tp_msglost
bind v tp_msgcoming
bind b tp_msgreplace
bind u messagemode2
bind i messagemode
// KP_STAR is the legacy shotgun-return switch; retain match-save on KP_SLASH.
bind KP_SLASH match_save
// Match nQuake's in-console binding help to the new layout.
alias _teamsays_echo_3 "echo V tells your team you are coming"
alias _teamsays_echo_4 "echo G reports your location as safe"
alias _teamsays_echo_5 "echo H requests help from your team"
alias _teamsays_echo_6 "echo T reports the pointed item or player"
alias _teamsays_echo_7 "echo Y reports your location as lost"
alias _teamsays_echo_8 "echo B requests a replacement"
legacy_crosshair
echo Quick ESDF controls and original weapon crosshairs loaded.

w_switch "8"

b_switch "8"

bind q "weapon 6"
