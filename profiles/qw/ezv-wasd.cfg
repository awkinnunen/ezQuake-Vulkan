// PUBLIC-001, 2026-09-13. User-selected controls, packaged by OpenAI Codex.
// Adapted from the user's legacy FuhQuake aliases; earlier snippet authors unknown.
// Load after your nQuake config with exec ezv-wasd.cfg. Does not reset graphics.
// Letters move left from ESDF; boundary A -> CapsLock, Q -> Z.
// Existing non-letter nQuake bindings remain in place.
allow_scripts 2

// Keep the old jump timing; restore keyboard look speed after each jump.
alias legacy_frj "impulse 7;rotate 180;+jump;+attack;wait;rotate 180;-attack;-jump"
alias legacy_sj "set legacy_pitchspeed $cl_pitchspeed;cl_pitchspeed 350;+forward;impulse 7;wait;wait;wait;wait;wait;wait;+jump;-forward;+lookdown;wait;wait;wait;-lookdown;-jump;legacy_frj;force_centerview;cl_pitchspeed $legacy_pitchspeed"
alias legacy_rj "set legacy_pitchspeed $cl_pitchspeed;cl_pitchspeed 9999;+lookdown;impulse 7;+jump;wait;wait;+attack;wait;-lookdown;-attack;force_centerview;-jump;cl_pitchspeed $legacy_pitchspeed"
set legacy_forwardheld 0
set legacy_backheld 0
alias legacy_jump_back "if $legacy_backheld == 0 then bind CAPSLOCK legacy_sj else bind CAPSLOCK legacy_rj"
alias legacy_jump_bind "if $legacy_forwardheld == 0 then legacy_jump_back else bind CAPSLOCK legacy_rj"
alias +legacy_fw "+forward;set legacy_forwardheld 1;legacy_jump_bind"
alias -legacy_fw "-forward;set legacy_forwardheld 0;legacy_jump_bind"
alias +legacy_bw "+back;set legacy_backheld 1;legacy_jump_bind"
alias -legacy_bw "-back;set legacy_backheld 0;legacy_jump_bind"

// Old weapon preferences. Release normally keeps the selected weapon.
alias +legacy_rl "impulse 7 5 3 4 2 1;+attack"
alias -legacy_rl "legacy_release"
alias +legacy_gl "impulse 6 5 4 3 2 1;+attack"
alias -legacy_gl "legacy_release"
alias +legacy_shaft "set legacy_lgfiring 1;impulse 8 3 2 5 4 1;+attack;legacy_crosshair"
alias -legacy_shaft "set legacy_lgfiring 0;legacy_release;legacy_crosshair"
alias +legacy_sg "impulse 2;+attack"
alias -legacy_sg "legacy_release"
alias +legacy_sng "impulse 5 4 2;+attack"
alias -legacy_sng "legacy_release"
alias +legacy_ssg "impulse 3 2;+attack"
alias -legacy_ssg "legacy_release"
alias legacy_keep_weapon "-attack"
alias legacy_return_sg "impulse 2;-attack"
alias legacy_denial_off "alias legacy_release legacy_keep_weapon;bind KP_STAR legacy_denial_on;echo Legacy shotgun return: off"
alias legacy_denial_on "alias legacy_release legacy_return_sg;bind KP_STAR legacy_denial_off;echo Legacy shotgun return: on"
legacy_denial_off

// Built-in weapon crosshairs; no external PNGs required.
crosshairimage ""
crosshair 2
crosshaircolor 15
crosshairalpha 0.6
crosshairsize 2.5
cl_crossy 2
set legacy_lgfiring 0
alias legacy_clearcross "crosshair 0"
alias legacy_crosslg "if $legacy_lgfiring == 1 then crosshair 0 else crosshair 6"
alias legacy_crosshair "if $weaponnum == 1 then crosshair 0;if $weaponnum == 2 then crosshair 2;if $weaponnum == 3 then crosshair 2;if $weaponnum == 4 then crosshair 3;if $weaponnum == 5 then crosshair 3;if $weaponnum == 6 then crosshair 4;if $weaponnum == 7 then crosshair 5;if $weaponnum == 8 then legacy_crosslg"
alias f_weaponchange "legacy_crosshair"
tp_triggers 1

bind w +legacy_fw
bind s +legacy_bw
bind a +moveleft
bind d +moveright
bind CAPSLOCK legacy_sj
bind MOUSE1 +legacy_rl
bind MOUSE2 +legacy_shaft
bind MOUSE3 +legacy_gl
bind SPACE +jump
// nQuake communication keys aligned with WASD.
unbind q
unbind x
unbind e
bind f tp_msgsafe
bind g tp_msghelp
bind r "tp_msgpoint; shownick"
bind t tp_msglost
bind c tp_msgcoming
bind v tp_msgreplace
bind y messagemode2
bind u messagemode
// KP_STAR is the legacy shotgun-return switch; retain match-save on KP_SLASH.
bind KP_SLASH match_save
// Match nQuake's in-console binding help to the new layout.
alias _teamsays_echo_3 "echo C tells your team you are coming"
alias _teamsays_echo_4 "echo F reports your location as safe"
alias _teamsays_echo_5 "echo G requests help from your team"
alias _teamsays_echo_6 "echo R reports the pointed item or player"
alias _teamsays_echo_7 "echo T reports your location as lost"
alias _teamsays_echo_8 "echo V requests a replacement"
legacy_crosshair
echo Quick WASD controls and built-in weapon crosshairs loaded.

w_switch "8"

b_switch "8"

// Final letter bindings. Other key groups retain their installed bindings.
unbind a
unbind b
unbind c
unbind capslock
unbind d
unbind e
unbind f
unbind g
unbind h
unbind i
unbind j
unbind k
unbind l
unbind m
unbind n
unbind o
unbind p
unbind q
unbind r
unbind s
unbind t
unbind u
unbind v
unbind w
unbind x
unbind y
unbind z
bind a "+moveleft"
bind c "tp_msgcoming"
bind capslock "legacy_sj"
bind d "+moveright"
bind f "tp_msgsafe"
bind g "tp_msghelp"
bind r "tp_msgpoint; shownick"
bind s "+legacy_bw"
bind t "tp_msglost"
bind u "messagemode"
bind v "tp_msgreplace"
bind w "+legacy_fw"
bind y "messagemode2"
bind z "weapon 6"
