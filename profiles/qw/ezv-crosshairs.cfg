// INPUT-005. Original legacy PNGs included at the user's request, 2026-09-16.
// Integration: OpenAI Codex. Original image/snippet authors are not established.
// Crosshairs only: leaves bindings, graphics and sensitivity unchanged.
crosshair 0
crosshairimage legacy_sg
crosshaircolor 15
crosshairalpha 0.6
crosshairsize 2.5
crosshairscale 0
crosshairscalemethod 0
r_smoothcrosshair 1
cl_crossy 2
set legacy_lgfiring 0
alias legacy_clearcross "crosshairimage $qt$qt"
alias legacy_crosslg "if $legacy_lgfiring == 1 then legacy_clearcross else crosshairimage legacy_lg"
alias legacy_crosshair "if $weaponnum == 1 then legacy_clearcross;if $weaponnum == 2 then crosshairimage legacy_sg;if $weaponnum == 3 then crosshairimage legacy_sg;if $weaponnum == 4 then crosshairimage legacy_ng;if $weaponnum == 5 then crosshairimage legacy_ng;if $weaponnum == 6 then crosshairimage legacy_gl;if $weaponnum == 7 then crosshairimage legacy_rl;if $weaponnum == 8 then legacy_crosslg"
alias f_weaponchange "legacy_crosshair"
tp_triggers 1
legacy_crosshair
echo Original weapon crosshairs loaded. Size: crosshairsize 2.5
