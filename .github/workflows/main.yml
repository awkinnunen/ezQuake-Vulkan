name: main

on:
  push:
    # Only build branches on push, tags will be handled by 'release' job.
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            configurePreset: msbuild-x64
            buildPreset: msbuild-x64-release
            name: ezQuake-windows-x64
            artifact: "ezquake.exe"
            container: null
          - os: macos-latest
            configurePreset: macos-arm64
            buildPreset: macos-arm64-release
            name: ezQuake-macOS-arm64
            artifact: "unused"
            packages: ["autoconf", "automake", "libtool"]
            container: null
          - os: macos-latest
            configurePreset: macos-x64
            buildPreset: macos-x64-release
            name: ezQuake-macOS-x64
            artifact: "unused"
            packages: ["autoconf", "automake", "libtool"]
            container: null
          - os: ubuntu-latest
            configurePreset: dynamic
            buildPreset: dynamic-release
            name: ezQuake-linux-x86_64
            artifact: "unused"
            cflags: "-march=nehalem"
            packages: ["build-essential", "ca-certificates", "cmake", "curl", "file", "git", "glslang-tools", "libcurl4-openssl-dev", "libexpat1-dev", "libfreetype-dev", "libjansson-dev", "libjpeg-dev", "libminizip-dev", "libpcre2-dev", "libpng-dev", "libsndfile1-dev", "libspeex-dev", "libspeexdsp-dev", "libvulkan-dev", "ninja-build", "unzip", "zlib1g-dev", "xdg-utils", "libx11-dev", "libxext-dev", "libxrandr-dev", "libxcursor-dev", "libxi-dev", "libxfixes-dev", "libxss-dev", "libwayland-dev", "libxkbcommon-dev", "libegl1-mesa-dev", "libasound2-dev", "libpulse-dev", "libdbus-1-dev", "libudev-dev", "libdecor-0-dev", "python3", "patchelf", "zip"]
            container:
              image: ubuntu:24.04
              options: --privileged

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
    - name: Prepare Linux environment
      run: |
        apt-get -qq update && apt-get -qq install --no-install-recommends ${{ join(matrix.packages, ' ') }}
        git config --global --add safe.directory $PWD
      if: matrix.os == 'ubuntu-latest'

    - name: Prepare macOS environment
      run: brew install -q ${{ join(matrix.packages, ' ') }}
      if: matrix.os == 'macos-latest'

    - name: Install Vulkan SDK
      shell: pwsh
      run: |
        # Pinned to a version confirmed present on the LunarG CDN at the time
        # of writing (curl -I on the versioned URL 404's for stale/removed
        # releases -- "latest" resolved to this version when checked).
        $ver = "1.4.350.0"
        $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
        Invoke-WebRequest -Uri $url -OutFile vulkan-sdk.exe
        # Qt IFW-based installer (LunarG SDK >= 1.2.189): silent/unattended
        # flags, no license prompt. --root pins a fixed path we can point
        # CMake's FindVulkan (VULKAN_SDK env var) at without probing the
        # registry for whatever version got installed.
        Start-Process -FilePath .\vulkan-sdk.exe -ArgumentList "--root C:\VulkanSDK\$ver --accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow
        echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
        echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      if: matrix.os == 'windows-2025-vs2026'

    - name: Install Vulkan SDK
      shell: bash
      run: |
        # brew's vulkan-loader/molten-vk are arm64-only on this Apple Silicon
        # runner -- linking the x64-osx job against them failed with every
        # vk* symbol undefined (wrong architecture, not a missing package).
        # The LunarG SDK's macOS loader/MoltenVK libs are universal
        # (arm64+x86_64 fat binaries, confirmed via lipo -info), so the same
        # install serves both macos-arm64 and macos-x64 configurePresets.
        ver="1.4.350.1"
        url="https://sdk.lunarg.com/sdk/download/$ver/mac/vulkansdk-macos-$ver.zip"
        curl -sSL -o vulkan-sdk.zip "$url"
        unzip -q vulkan-sdk.zip
        # The .app's name/casing (vulkansdk-macOS-<ver>.app, not
        # InstallVulkan-*.app) matched neither a first-guess pattern nor the
        # Windows installer's InstallVulkan-* naming -- confirmed by
        # unzip -l against the real archive rather than assuming.
        installer_app=$(echo vulkansdk-macOS-*.app)
        installer_bin="$installer_app/Contents/MacOS/$(basename "$installer_app" .app)"
        root="$HOME/VulkanSDK/$ver"
        "$installer_bin" --root "$root" --accept-licenses --default-answer --confirm-command install
        echo "VULKAN_SDK=$root/macOS" >> $GITHUB_ENV
        echo "$root/macOS/bin" >> $GITHUB_PATH
      if: matrix.os == 'macos-latest'

    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: true
        # To get correct revision which is needed by server to detect certain client bugs
        fetch-depth: 0

    - name: Fetch upstream tags for version metadata
      run: |
          git remote add upstream https://github.com/QW-Group/ezquake-source.git
          git fetch --tags --no-recurse-submodules upstream
      if: github.repository != 'QW-Group/ezquake-source'

    - name: Set library build type to release
      shell: bash
      run: |
        # Hopefully overrideable via environment in the future. Done here as
        # vcpkg is chainloaded before cmake, and doesn't seem to apply args.
        # Avoids building both -dbg and -rel versions of static libraries.
        for x in {cmake/triplets/*,vcpkg/triplets/{*,community/*}}; do
          if [[ -f $x ]]; then
            echo >> $x
            echo 'set(VCPKG_BUILD_TYPE release)' >> $x
          fi
        done
      if: matrix.os != 'ubuntu-latest'

    - uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~4.2.0"
      if: matrix.os != 'ubuntu-latest'

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      if: matrix.os != 'ubuntu-latest'

    - name: Build portable Friends dependencies
      if: matrix.os == 'ubuntu-latest'
      run: bash tools/Build-UnixRuntime.sh /opt/ezv-deps

    - name: Run CMake
      uses: lukka/run-cmake@v10
      with:
        configurePreset: ${{ matrix.configurePreset }}
        configurePresetAdditionalArgs: "['-DRENDERER_VULKAN=ON', '-DENABLE_SANDBOX=OFF', '-DENABLE_LTO=OFF', '-DCMAKE_PREFIX_PATH=/opt/ezv-deps']"
        buildPreset: ${{ matrix.buildPreset }}
      env:
        CFLAGS: ${{ matrix.cflags }}

    - name: Build and test native Friends protocol
      shell: bash
      run: |
        cmake --build build-${{ matrix.configurePreset }} --config Release --target ezquake-friends-tests
        build-${{ matrix.configurePreset }}/Release/ezquake-friends-tests --unit "$RUNNER_TEMP/friends-unit"
      if: matrix.os != 'windows-2025-vs2026'

    - name: Package native Unix Starter
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          arch="${{ matrix.configurePreset }}"
          python3 tools/Package-Unix.py --platform macos --arch "${arch#macos-}" \
            --binary "build-${{ matrix.configurePreset }}/Release/ezQuake.app" \
            --installer "build-${{ matrix.configurePreset }}/Release/ezv-install" \
            --dependency-share "build-${{ matrix.configurePreset }}/vcpkg_installed/${arch#macos-}-osx/share" \
            --sdk "$VULKAN_SDK" --version 0.3.0-beta.1 --output packages
        else
          python3 tools/Package-Unix.py --platform linux --arch x86_64 \
            --binary build-dynamic/Release/ezquake-linux-x86_64 \
            --installer build-dynamic/Release/ezv-install \
            --dependency-sources /opt/ezv-deps/share/ezv-sources \
            --version 0.3.0-beta.1 --output packages
        fi
      if: matrix.os != 'windows-2025-vs2026'

    - name: Archive Unix packages and matching sources
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: |
          packages/*.zip*
          packages/*.tar.gz*
          packages/*.dmg*
        compression-level: 0
      if: matrix.os != 'windows-2025-vs2026'

    - name: Archive Windows client
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: build-${{ matrix.configurePreset }}/Release/${{ matrix.artifact }}
      if: matrix.os == 'windows-2025-vs2026'
